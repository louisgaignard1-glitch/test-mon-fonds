name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff) et syntaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Syntaxe Python (compilation)
        run: python -m compileall -q .

      # Bloquant : erreurs de syntaxe, noms non définis, comparaisons/instructions invalides
      - name: Ruff - erreurs bloquantes
        run: ruff check . --select E9,F63,F7,F82 --output-format=github

      # Informatif : bonnes pratiques (imports inutilisés, variables non utilisées...), non bloquant
      - name: Ruff - revue qualité (non bloquant)
        run: ruff check . --select F,E7,W6,B --ignore E701,E702,E731,B905 --exit-zero --output-format=github

  tests:
    name: Dépendances et tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Cohérence des dépendances
        run: pip check

      - name: Import des bibliothèques clés
        run: |
          python - <<'PY'
          import duckdb, matplotlib, numpy, pandas, plotly, reportlab, streamlit, yfinance
          print("pandas", pandas.__version__, "| duckdb", duckdb.__version__,
                "| streamlit", streamlit.__version__)
          PY

      - name: Import du module factsheet_export
        run: python -c "import factsheet_export; print('factsheet_export OK, RF =', factsheet_export.RF)"

      # Structure prête pour les tests unitaires : déposer les fichiers test_*.py dans tests/.
      # Code de sortie 5 de pytest = aucun test collecté, toléré tant que tests/ est vide.
      - name: Tests unitaires (pytest)
        env:
          PYTHONPATH: ${{ github.workspace }}
          PRICE_DB_PATH: ":memory:"
        run: |
          mkdir -p tests
          set +e
          pytest -q tests
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "Aucun test dans tests/ : ajoutez des fichiers test_*.py."
            exit 0
          fi
          exit "$code"
